name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o "dist/quickproxy-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/quickproxy
      - uses: actions/upload-artifact@v4
        with:
          name: quickproxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS universal app and DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go core
        run: go test ./...
      - name: Compile macOS architectures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build dist
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          for ARCH in arm64 amd64; do
            GOOS=darwin GOARCH="$ARCH" go build -trimpath -ldflags="-s -w" \
              -o "build/core-$ARCH" ./cmd/quickproxy
            cp "build/core-$ARCH" "dist/quickproxy-darwin-$ARCH"
          done
          for ARCH in arm64 x86_64; do
            xcrun swiftc \
              -target "$ARCH-apple-macos13.0" \
              -sdk "$SDK" -O \
              -framework SwiftUI -framework AppKit -framework Foundation \
              -o "build/gui-$ARCH" \
              macos/QuickProxyApp.swift
          done
      - name: Assemble and sign app
        shell: bash
        run: |
          set -euo pipefail
          APP="build/QuickProxy.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp macos/Info.plist "$APP/Contents/Info.plist"
          lipo -create build/gui-arm64 build/gui-x86_64 \
            -output "$APP/Contents/MacOS/QuickProxy"
          lipo -create build/core-arm64 build/core-amd64 \
            -output "$APP/Contents/Resources/quickproxy"
          chmod 755 "$APP/Contents/MacOS/QuickProxy" "$APP/Contents/Resources/quickproxy"
          codesign --force --sign - "$APP/Contents/Resources/quickproxy"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/QuickProxy"
          lipo -archs "$APP/Contents/Resources/quickproxy"
      - name: Package distributables
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "build/QuickProxy.app" "dist/QuickProxy-macOS-universal.zip"
          mkdir -p build/dmg-root
          ditto "build/QuickProxy.app" "build/dmg-root/QuickProxy.app"
          ln -s /Applications "build/dmg-root/Applications"
          hdiutil create \
            -volname "QuickProxy" \
            -srcfolder build/dmg-root \
            -ov -format UDZO \
            "dist/QuickProxy-macOS-universal.dmg"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: QuickProxy-macOS
          path: dist/*
          if-no-files-found: error

  preview:
    name: publish macOS preview
    needs: [build, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QuickProxy-macOS
          path: dist
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view macos-preview >/dev/null 2>&1 || \
            gh release create macos-preview --target "$GITHUB_SHA" \
              --prerelease --title "QuickProxy macOS Preview" \
              --notes "自动构建的 macOS 版本。安装限制请查看 docs/MACOS_NOTES.md。"
          gh release upload macos-preview \
            dist/QuickProxy-macOS-universal.dmg \
            dist/QuickProxy-macOS-universal.zip --clobber

  release:
    name: publish versioned release
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
